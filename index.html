<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎤 初業專屬法規 KTV</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 15px;
            text-align: center;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #334155;
            z-index: 10;
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #818cf8;
        }
        .lyrics-container {
            flex: 1;
            overflow-y: auto;
            padding: 40vh 20px 40vh 20px;
            scroll-behavior: smooth;
        }
        .lyric-line {
            font-size: 1.3rem;
            font-weight: bold;
            color: #475569;
            text-align: center;
            margin: 25px 0;
            transition: color 0.3s, transform 0.3s;
            cursor: pointer;
        }
        .lyric-line.active {
            color: #10b981;
            transform: scale(1.15);
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
        }
        .player-container {
            padding: 20px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .big-play-btn {
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 80%;
            justify-content: center;
            max-width: 300px;
        }
        .big-play-btn:active {
            transform: scale(0.95);
            background: #4f46e5;
        }
        #status-msg {
            color: #ef4444;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }
        .progress-bar {
            width: 90%;
            max-width: 400px;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-top: 15px;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: #10b981;
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎤 上市上櫃的門檻 KTV</h1>
    </div>

    <div class="lyrics-container" id="lyrics">
        <div class="lyric-line" style="color: #94a3b8; font-size: 1rem;">正在載入歌詞與音樂...</div>
    </div>

    <div class="player-container">
        <button id="playBtn" class="big-play-btn">▶️ 開始播放</button>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="status-msg"></div>
        <audio id="audio" preload="auto">
            <source src="song.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const statusMsg = document.getElementById('status-msg');
        const progressBar = document.getElementById('progress');
        let isPlaying = false;
        let lyricsData = [];
        let currentIndex = -1;

        // 錯誤處理
        audio.addEventListener('error', (e) => {
            statusMsg.style.display = 'block';
            statusMsg.innerText = '載入音樂失敗，請確認網路連線或稍後重新整理網頁。';
            playBtn.innerText = '❌ 無法播放';
            playBtn.style.background = '#ef4444';
        });

        // 播放按鈕邏輯
        playBtn.addEventListener('click', () => {
            if (audio.error) return;
            
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = '▶️ 繼續播放';
                playBtn.style.background = '#6366f1';
            } else {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        playBtn.innerHTML = '⏸️ 暫停';
                        playBtn.style.background = '#f59e0b';
                        statusMsg.style.display = 'none';
                    }).catch(error => {
                        statusMsg.style.display = 'block';
                        statusMsg.innerText = '瀏覽器阻擋播放，請檢查靜音模式或重整。';
                    });
                }
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.innerHTML = '▶️ 重新播放';
            playBtn.style.background = '#6366f1';
        });

        // 載入歌詞 (加入 cache-busting 確保總是抓到最新版)
        fetch('lyrics.lrc?v=' + new Date().getTime())
            .then(res => {
                if (!res.ok) throw new Error('Network response was not ok');
                return res.text();
            })
            .then(text => {
                parseLRC(text);
            })
            .catch(err => {
                document.getElementById('lyrics').innerHTML = '<div class="lyric-line" style="color:#ef4444;">無法載入歌詞，請稍後重試。</div>';
            });

        function parseLRC(lrc) {
            const lines = lrc.split('\n');
            const regex = /\[(\d+):(\d+\.\d+)\](.*)/;
            
            lines.forEach(line => {
                const match = regex.exec(line);
                if (match) {
                    const mins = parseInt(match[1]);
                    const secs = parseFloat(match[2]);
                    const text = match[3].trim();
                    if (text) {
                        lyricsData.push({ time: mins * 60 + secs, text: text });
                    }
                }
            });
            renderLyrics();
        }

        function renderLyrics() {
            const container = document.getElementById('lyrics');
            container.innerHTML = ''; // 清空載入中提示
            lyricsData.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.innerText = line.text;
                el.id = 'line-' + index;
                
                // 點擊歌詞跳轉
                el.onclick = () => {
                    audio.currentTime = line.time;
                    audio.play().then(() => {
                        isPlaying = true;
                        playBtn.innerHTML = '⏸️ 暫停';
                        playBtn.style.background = '#f59e0b';
                    }).catch(e => {
                        statusMsg.style.display = 'block';
                        statusMsg.innerText = '請先點擊下方開始播放按鈕，再點擊歌詞。';
                    });
                };
                container.appendChild(el);
            });
        }

        // 時間與高光同步
        audio.addEventListener('timeupdate', () => {
            const time = audio.currentTime;
            
            // 進度條
            if (audio.duration) {
                progressBar.style.width = (time / audio.duration * 100) + '%';
            }
            
            // 尋找當前應該高光的歌詞
            let newIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (time >= lyricsData[i].time) {
                    newIndex = i;
                } else {
                    break;
                }
            }

            if (newIndex !== currentIndex && newIndex !== -1) {
                if (currentIndex !== -1) {
                    const oldEl = document.getElementById('line-' + currentIndex);
                    if(oldEl) oldEl.classList.remove('active');
                }
                currentIndex = newIndex;
                const activeEl = document.getElementById('line-' + currentIndex);
                if (activeEl) {
                    activeEl.classList.add('active');
                    // 自動滾動置中
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });
    </script>
</body>
</html>
